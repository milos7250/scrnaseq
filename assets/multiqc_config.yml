report_comment: >
  This report has been generated by the <a href="https://github.com/milos7250/scrnaseq/releases/tag/4.0.0-cutadapt-2"
  target="_blank">nf-core/scrnaseq</a> analysis pipeline. For information about how
  to interpret these results, please see the <a href="https://nf-co.re/milos7250/4.0.0-cutadapt-2/docs/output"
  target="_blank">documentation</a>.
report_section_order:
# Preprocessing and pre-alignment QC
  fastqc_raw:
    order: 4004
  cutadapt:
    order: 4003
  fastqc_trimmed:
    order: 4002
  "nf-core-scrnaseq-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-scrnaseq-summary":
    order: -1002

export_plots: true
disable_version_detection: true
sample_names_replace_exact: true

module_order:
- fastqc:
    anchor: "fastqc_raw"
    name: "FastQC (raw)"
    info: "This section of the report shows FastQC results before adapter trimming."
    path_filters:
    - "*_raw*fastqc.zip"
- cutadapt:
    anchor: "cutadapt_barcode"
    name: "Cutadapt (barcode trimming)"
    info: "This section of the report shows Cutadapt results for filtering R1 for
      barcode followed by polyT."
    path_filters:
    - "*barcode*.trim.fastq.gz"
- cutadapt:
    anchor: "cutadapt_read"
    name: "Cutadapt (read trimming)"
    info: "This section of the report shows Cutadapt results for filtering R2 for
      adapters."
    path_filters:
    - "*read*.trim.fastq.gz"
- cutadapt:
    anchor: "cutadapt_polya"
    name: "Cutadapt (poly-a trimming)"
    info: "This section of the report shows Cutadapt results for filtering R2 polyA
      tail."
    path_filters:
    - "*polya*.trim.fastq.gz"
- fastqc:
    anchor: "fastqc_trimmed"
    name: "FastQC (trimmed)"
    info: "This section of the report shows FastQC results after adapter trimming."
    path_filters:
    - "*_trimmed*fastqc.zip"
